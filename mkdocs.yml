site_name: EIDA Consistency
site_url: https://EIDA.github.io/eida-consistency/
repo_url: https://github.com/EIDA/eida-consistency
repo_name: EIDA/eida-consistency
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.expand
    - navigation.indexes
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

nav:
  - Home: index.md
  - Usage: user/usage.md
  - Development: developer/development.md
