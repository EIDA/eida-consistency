name: Run Tests and Update Coverage Badge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Pytest with Coverage
        run: |
          uv run pytest --cov=src --cov-report=term --cov-report=xml

      - name: Generate SVG Coverage Badge
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: coverage.svg

      - name: Move badge to badges/ directory
        run: |
          mkdir -p badges
          mv coverage.svg badges/coverage.svg

      - name: Commit and push badge
        # github.ref alone was not enough: a pull_request run reached this step
        # and tried to push to main. Require the event to be a push as well.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add badges/coverage.svg
          if git diff --cached --quiet; then
            echo "Badge unchanged - nothing to push."
            exit 0
          fi
          git commit -m "Update coverage badge"

          # main can move while this job runs - another merge landing, or a
          # backlog draining after an Actions outage - and the push is then
          # rejected as non-fast-forward. Rebase onto whatever main is now and
          # retry instead of failing the build over a badge.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3); rebasing onto origin/main."
            git pull --rebase origin main || exit 1
          done
          echo "Could not push the coverage badge after 3 attempts."
          exit 1

  viewer:
    # The HTML viewer is dependency-free JS tested with the built-in Node test
    # runner, so it needs no install step and runs alongside the Python tests.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run viewer tests
        run: node --test viewer/
