<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIDA Consistency — report viewer</title>
<style>
:root{--bg:#fff;--fg:#222;--mut:#666;--line:#e0e0e0}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--fg:#e0e0e0;--mut:#999;--line:#333}}
body{font-family:Roboto,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}
.summary{display:flex;gap:1rem;align-items:baseline;border-bottom:1px solid var(--line)}
.toolbar{display:flex;gap:1rem;align-items:center;padding:.6rem 0}
table.results{width:100%;border-collapse:collapse}
table.results td,table.results th{border-bottom:1px solid var(--line);padding:.3rem .5rem;text-align:left;cursor:pointer}
.timeline{position:relative;height:14px;background:var(--line);border-radius:3px;margin:.4rem 0}
.timeline i{position:absolute;top:0;height:100%}
.timeline b{position:absolute;top:-2px;height:18px;width:2px;background:var(--fg)}
.gap{margin:.3rem 0;font-size:.9rem}
.result{color:var(--mut)}
</style></head>
<body><div class="wrap">
  <div id="summary"></div>
  <div class="toolbar">
    <label><input type="checkbox" id="onlyInc" checked> only inconsistent</label>
    <select id="dir"><option value="both">both ▲▼</option><option value="dataselect">▲ data-only</option><option value="availability">▼ avail-only</option></select>
    <input id="search" placeholder="search NET.STA.CHA">
  </div>
  <div id="results"></div>
  <div id="detail"></div>
</div>
<script type="module" src="viewer.js"></script>
</body></html>
